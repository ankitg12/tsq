[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsq"
version = "0.4.0"
description = "A daily task queue in Logseq Markdown journals, from the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ankit Gaur"}]
keywords = ["logseq", "cli", "journal", "daily-priorities"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.scripts]
tsq = "tsq:main"

[tool.setuptools]
py-modules = ["tsq"]
